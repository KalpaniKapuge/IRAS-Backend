      <line x1="690" y1="825" x2="820" y2="825" stroke="#334155" stroke-width="3"/>

      <line x1="1390" y1="210" x2="1520" y2="210" stroke="#334155" stroke-width="3"/>
      <line x1="1390" y1="320" x2="1520" y2="320" stroke="#334155" stroke-width="3"/>
      <line x1="1390" y1="435" x2="1520" y2="435" stroke="#334155" stroke-width="3"/>
      <line x1="1390" y1="560" x2="1520" y2="560" stroke="#334155" stroke-width="3"/>
      <line x1="1390" y1="690" x2="1520" y2="690" stroke="#334155" stroke-width="3"/>
      <line x1="1390" y1="825" x2="1520" y2="825" stroke="#334155" stroke-width="3"/>

      <path d="M 405 250 L 405 280 M 405 360 L 405 390 M 405 480 L 405 510 M 405 610 L 405 640 M 405 740 L 405 770" stroke="#334155" stroke-width="3" fill="none"/>
      <path d="M 1105 250 L 1105 280 M 1105 360 L 1105 390 M 1105 490 L 1105 520 M 1105 620 L 1105 650 M 1105 750 L 1105 780" stroke="#334155" stroke-width="3" fill="none"/>
      <path d="M 1805 250 L 1805 280 M 1805 360 L 1805 390 M 1805 490 L 1805 520 M 1805 620 L 1805 650 M 1805 750 L 1805 780" stroke="#334155" stroke-width="3" fill="none"/>

      <rect x="190" y="970" width="1820" height="140" rx="24" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
      <text x="1100" y="1015" font-size="26" font-family="Arial" font-weight="bold" text-anchor="middle" fill="#334155">SHARED SYSTEM SERVICES</text>
      <text x="1100" y="1055" font-size="20" font-family="Arial" text-anchor="middle" fill="#475569">Authentication • SQL Database • File Storage • AI Service • Semantic Matching • Candidate Fit Model • Audit Logs</text>
      <text x="1100" y="1098" font-size="18" font-family="Arial" text-anchor="middle" fill="#475569">System boundary: AI features support decision-making, while human users retain final control over recruitment actions.</text>
    </svg>
    