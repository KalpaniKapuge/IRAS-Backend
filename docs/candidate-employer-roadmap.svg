<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320" role="img" aria-labelledby="title desc">
  <title id="title">IRAS Candidate and Employer Roadmap</title>
  <desc id="desc">A two-lane process roadmap showing candidate tasks, employer tasks, and shared AI and administration features in the Intelligent Recruitment Automation System.</desc>
  <defs>
    <style>
      .bg { fill: #f7f9fb; }
      .title { font: 700 44px Arial, sans-serif; fill: #172033; }
      .subtitle { font: 400 22px Arial, sans-serif; fill: #546276; }
      .lane-title { font: 700 28px Arial, sans-serif; fill: #ffffff; }
      .lane-subtitle { font: 400 16px Arial, sans-serif; fill: #e9f1ff; }
      .section-title { font: 700 21px Arial, sans-serif; fill: #1d2a3d; }
      .body { font: 400 16px Arial, sans-serif; fill: #344154; }
      .small { font: 400 14px Arial, sans-serif; fill: #4d5a6d; }
      .tiny { font: 400 12px Arial, sans-serif; fill: #516074; }
      .tag { font: 700 12px Arial, sans-serif; fill: #ffffff; }
      .candidate-header { fill: #1565c0; }
      .employer-header { fill: #0f766e; }
      .support-header { fill: #455a64; }
      .candidate-card { fill: #ffffff; stroke: #b9d4f5; stroke-width: 2; }
      .employer-card { fill: #ffffff; stroke: #a9d9d1; stroke-width: 2; }
      .support-card { fill: #ffffff; stroke: #c3ccd6; stroke-width: 2; }
      .candidate-accent { fill: #e8f2ff; }
      .employer-accent { fill: #e8f7f4; }
      .support-accent { fill: #eef2f5; }
      .candidate-pill { fill: #1565c0; }
      .employer-pill { fill: #0f766e; }
      .support-pill { fill: #455a64; }
      .line-candidate { stroke: #1565c0; stroke-width: 4; fill: none; }
      .line-employer { stroke: #0f766e; stroke-width: 4; fill: none; }
      .line-support { stroke: #78909c; stroke-width: 3; fill: none; stroke-dasharray: 8 8; }
      .arrow { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .shadow { filter: drop-shadow(0 6px 12px rgba(20, 33, 61, 0.13)); }
    </style>
    <marker id="arrowCandidate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0"/>
    </marker>
    <marker id="arrowEmployer" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <marker id="arrowSupport" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#78909c"/>
    </marker>
  </defs>

  <rect class="bg" width="1800" height="1320"/>

  <text x="900" y="70" text-anchor="middle" class="title">Intelligent Recruitment Automation System Roadmap</text>
  <text x="900" y="106" text-anchor="middle" class="subtitle">Candidate and Employer Process Flow with Main Tasks, Steps, and Implemented Features</text>

  <rect x="70" y="145" width="760" height="74" rx="8" class="candidate-header shadow"/>
  <text x="100" y="180" class="lane-title">Candidate Roadmap</text>
  <text x="100" y="204" class="lane-subtitle">From account creation to applications, recommendations, interviews, feedback, and CV building</text>

  <rect x="970" y="145" width="760" height="74" rx="8" class="employer-header shadow"/>
  <text x="1000" y="180" class="lane-title">Employer Roadmap</text>
  <text x="1000" y="204" class="lane-subtitle">From account creation to job publishing, applicant ranking, interviews, and feedback review</text>

  <rect x="680" y="248" width="440" height="548" rx="8" class="support-card shadow"/>
  <rect x="680" y="248" width="440" height="54" rx="8" class="support-header"/>
  <text x="900" y="282" text-anchor="middle" class="lane-title">Shared Intelligence Layer</text>

  <rect x="710" y="328" width="380" height="68" rx="8" class="support-accent"/>
  <text x="730" y="354" class="section-title">AI Resume Parsing</text>
  <text x="730" y="379" class="small">Extracts text, emails, phones, and detected skills</text>

  <rect x="710" y="420" width="380" height="68" rx="8" class="support-accent"/>
  <text x="730" y="446" class="section-title">AI Ranking and Matching</text>
  <text x="730" y="471" class="small">Skill match + semantic similarity + ML fit score</text>

  <rect x="710" y="512" width="380" height="68" rx="8" class="support-accent"/>
  <text x="730" y="538" class="section-title">Gemini Text Generation</text>
  <text x="730" y="563" class="small">JD generation, feedback, skill gap explanations, chatbot</text>

  <rect x="710" y="604" width="380" height="68" rx="8" class="support-accent"/>
  <text x="730" y="630" class="section-title">Storage and Notifications</text>
  <text x="730" y="655" class="small">Local/Supabase files, profile images, certificates, alerts</text>

  <rect x="710" y="696" width="380" height="68" rx="8" class="support-accent"/>
  <text x="730" y="722" class="section-title">Admin and Governance</text>
  <text x="730" y="747" class="small">User management, job moderation, reports, audit logs</text>

  <!-- Candidate flow cards -->
  <g class="shadow">
    <rect x="70" y="255" width="270" height="118" rx="8" class="candidate-card"/>
    <rect x="92" y="277" width="42" height="28" rx="14" class="candidate-pill"/>
    <text x="113" y="296" text-anchor="middle" class="tag">01</text>
    <text x="152" y="296" class="section-title">Register / Login</text>
    <text x="92" y="326" class="body">Create candidate account</text>
    <text x="92" y="350" class="small">JWT authentication and secure profile access</text>

    <rect x="370" y="255" width="270" height="118" rx="8" class="candidate-card"/>
    <rect x="392" y="277" width="42" height="28" rx="14" class="candidate-pill"/>
    <text x="413" y="296" text-anchor="middle" class="tag">02</text>
    <text x="452" y="296" class="section-title">Build Profile</text>
    <text x="392" y="326" class="body">Add education, experience, skills</text>
    <text x="392" y="350" class="small">Add certifications, profile image, social links</text>

    <rect x="70" y="425" width="270" height="130" rx="8" class="candidate-card"/>
    <rect x="92" y="447" width="42" height="28" rx="14" class="candidate-pill"/>
    <text x="113" y="466" text-anchor="middle" class="tag">03</text>
    <text x="152" y="466" class="section-title">Upload Resume</text>
    <text x="92" y="496" class="body">Upload resume document</text>
    <text x="92" y="520" class="small">AI extracts resume text and detects skills</text>
    <text x="92" y="542" class="small">Candidate confirms parsed skills</text>

    <rect x="370" y="425" width="270" height="130" rx="8" class="candidate-card"/>
    <rect x="392" y="447" width="42" height="28" rx="14" class="candidate-pill"/>
    <text x="413" y="466" text-anchor="middle" class="tag">04</text>
    <text x="452" y="466" class="section-title">Browse Jobs</text>
    <text x="392" y="496" class="body">Search public jobs</text>
    <text x="392" y="520" class="small">View job details and requirements</text>
    <text x="392" y="542" class="small">Use skill taxonomy for accurate matching</text>

    <rect x="70" y="607" width="270" height="130" rx="8" class="candidate-card"/>
    <rect x="92" y="629" width="42" height="28" rx="14" class="candidate-pill"/>
    <text x="113" y="648" text-anchor="middle" class="tag">05</text>
    <text x="152" y="648" class="section-title">Receive Matches</text>
    <text x="92" y="678" class="body">View recommended jobs</text>
    <text x="92" y="702" class="small">Scores include skills, semantic fit, ML fit</text>
    <text x="92" y="724" class="small">View skill gap summary</text>

    <rect x="370" y="607" width="270" height="130" rx="8" class="candidate-card"/>
    <rect x="392" y="629" width="42" height="28" rx="14" class="candidate-pill"/>
    <text x="413" y="648" text-anchor="middle" class="tag">06</text>
    <text x="452" y="648" class="section-title">Apply for Jobs</text>
    <text x="392" y="678" class="body">Submit application with resume</text>
    <text x="392" y="702" class="small">Track application status</text>
    <text x="392" y="724" class="small">Receive notifications</text>

    <rect x="70" y="789" width="270" height="130" rx="8" class="candidate-card"/>
    <rect x="92" y="811" width="42" height="28" rx="14" class="candidate-pill"/>
    <text x="113" y="830" text-anchor="middle" class="tag">07</text>
    <text x="152" y="830" class="section-title">Attend Interviews</text>
    <text x="92" y="860" class="body">View scheduled interviews</text>
    <text x="92" y="884" class="small">Receive reschedule or cancellation updates</text>
    <text x="92" y="906" class="small">Track interview outcomes</text>

    <rect x="370" y="789" width="270" height="130" rx="8" class="candidate-card"/>
    <rect x="392" y="811" width="42" height="28" rx="14" class="candidate-pill"/>
    <text x="413" y="830" text-anchor="middle" class="tag">08</text>
    <text x="452" y="830" class="section-title">Get Feedback</text>
    <text x="392" y="860" class="body">View AI-assisted feedback</text>
    <text x="392" y="884" class="small">Understand improvement areas</text>
    <text x="392" y="906" class="small">Use skill gap explanations</text>

    <rect x="220" y="971" width="270" height="130" rx="8" class="candidate-card"/>
    <rect x="242" y="993" width="42" height="28" rx="14" class="candidate-pill"/>
    <text x="263" y="1012" text-anchor="middle" class="tag">09</text>
    <text x="302" y="1012" class="section-title">Create CV</text>
    <text x="242" y="1042" class="body">Use multi-template CV builder</text>
    <text x="242" y="1066" class="small">Customize sections and items</text>
    <text x="242" y="1088" class="small">Download CV as PDF</text>
  </g>

  <!-- Candidate arrows -->
  <path d="M340 314 H370" class="line-candidate arrow" marker-end="url(#arrowCandidate)"/>
  <path d="M505 373 C505 398 205 398 205 425" class="line-candidate arrow" marker-end="url(#arrowCandidate)"/>
  <path d="M340 490 H370" class="line-candidate arrow" marker-end="url(#arrowCandidate)"/>
  <path d="M505 555 C505 582 205 582 205 607" class="line-candidate arrow" marker-end="url(#arrowCandidate)"/>
  <path d="M340 672 H370" class="line-candidate arrow" marker-end="url(#arrowCandidate)"/>
  <path d="M505 737 C505 764 205 764 205 789" class="line-candidate arrow" marker-end="url(#arrowCandidate)"/>
  <path d="M340 854 H370" class="line-candidate arrow" marker-end="url(#arrowCandidate)"/>
  <path d="M505 919 C505 950 355 950 355 971" class="line-candidate arrow" marker-end="url(#arrowCandidate)"/>

  <!-- Employer flow cards -->
  <g class="shadow">
    <rect x="1160" y="255" width="270" height="118" rx="8" class="employer-card"/>
    <rect x="1182" y="277" width="42" height="28" rx="14" class="employer-pill"/>
    <text x="1203" y="296" text-anchor="middle" class="tag">01</text>
    <text x="1242" y="296" class="section-title">Register / Login</text>
    <text x="1182" y="326" class="body">Create employer account</text>
    <text x="1182" y="350" class="small">JWT authentication and protected access</text>

    <rect x="1460" y="255" width="270" height="118" rx="8" class="employer-card"/>
    <rect x="1482" y="277" width="42" height="28" rx="14" class="employer-pill"/>
    <text x="1503" y="296" text-anchor="middle" class="tag">02</text>
    <text x="1542" y="296" class="section-title">Build Profile</text>
    <text x="1482" y="326" class="body">Add company information</text>
    <text x="1482" y="350" class="small">Manage employer profile data</text>

    <rect x="1160" y="425" width="270" height="130" rx="8" class="employer-card"/>
    <rect x="1182" y="447" width="42" height="28" rx="14" class="employer-pill"/>
    <text x="1203" y="466" text-anchor="middle" class="tag">03</text>
    <text x="1242" y="466" class="section-title">Create Job</text>
    <text x="1182" y="496" class="body">Enter title, role, requirements</text>
    <text x="1182" y="520" class="small">Add required skills and weights</text>
    <text x="1182" y="542" class="small">Save as draft</text>

    <rect x="1460" y="425" width="270" height="130" rx="8" class="employer-card"/>
    <rect x="1482" y="447" width="42" height="28" rx="14" class="employer-pill"/>
    <text x="1503" y="466" text-anchor="middle" class="tag">04</text>
    <text x="1542" y="466" class="section-title">Generate JD</text>
    <text x="1482" y="496" class="body">Use Gemini-backed JD generation</text>
    <text x="1482" y="520" class="small">Review and edit generated description</text>
    <text x="1482" y="542" class="small">Publish or close job</text>

    <rect x="1160" y="607" width="270" height="130" rx="8" class="employer-card"/>
    <rect x="1182" y="629" width="42" height="28" rx="14" class="employer-pill"/>
    <text x="1203" y="648" text-anchor="middle" class="tag">05</text>
    <text x="1242" y="648" class="section-title">Receive Applicants</text>
    <text x="1182" y="678" class="body">View job applications</text>
    <text x="1182" y="702" class="small">Access candidate resume/profile data</text>
    <text x="1182" y="724" class="small">Track status history</text>

    <rect x="1460" y="607" width="270" height="130" rx="8" class="employer-card"/>
    <rect x="1482" y="629" width="42" height="28" rx="14" class="employer-pill"/>
    <text x="1503" y="648" text-anchor="middle" class="tag">06</text>
    <text x="1542" y="648" class="section-title">Rank Candidates</text>
    <text x="1482" y="678" class="body">Get AI ranked applicant list</text>
    <text x="1482" y="702" class="small">Compare skill, semantic, and ML fit scores</text>
    <text x="1482" y="724" class="small">Shortlist suitable candidates</text>

    <rect x="1160" y="789" width="270" height="130" rx="8" class="employer-card"/>
    <rect x="1182" y="811" width="42" height="28" rx="14" class="employer-pill"/>
    <text x="1203" y="830" text-anchor="middle" class="tag">07</text>
    <text x="1242" y="830" class="section-title">Manage Status</text>
    <text x="1182" y="860" class="body">Update application status</text>
    <text x="1182" y="884" class="small">Move candidate through recruitment stages</text>
    <text x="1182" y="906" class="small">Trigger notifications</text>

    <rect x="1460" y="789" width="270" height="130" rx="8" class="employer-card"/>
    <rect x="1482" y="811" width="42" height="28" rx="14" class="employer-pill"/>
    <text x="1503" y="830" text-anchor="middle" class="tag">08</text>
    <text x="1542" y="830" class="section-title">Schedule Interviews</text>
    <text x="1482" y="860" class="body">Schedule, reschedule, cancel</text>
    <text x="1482" y="884" class="small">Record location/mode/outcome</text>
    <text x="1482" y="906" class="small">Candidate can view interview list</text>

    <rect x="1310" y="971" width="270" height="130" rx="8" class="employer-card"/>
    <rect x="1332" y="993" width="42" height="28" rx="14" class="employer-pill"/>
    <text x="1353" y="1012" text-anchor="middle" class="tag">09</text>
    <text x="1392" y="1012" class="section-title">Review Feedback</text>
    <text x="1332" y="1042" class="body">Generate candidate feedback</text>
    <text x="1332" y="1066" class="small">Review and approve before candidate sees it</text>
    <text x="1332" y="1088" class="small">Close recruitment loop</text>
  </g>

  <!-- Employer arrows -->
  <path d="M1430 314 H1460" class="line-employer arrow" marker-end="url(#arrowEmployer)"/>
  <path d="M1595 373 C1595 398 1295 398 1295 425" class="line-employer arrow" marker-end="url(#arrowEmployer)"/>
  <path d="M1430 490 H1460" class="line-employer arrow" marker-end="url(#arrowEmployer)"/>
  <path d="M1595 555 C1595 582 1295 582 1295 607" class="line-employer arrow" marker-end="url(#arrowEmployer)"/>
  <path d="M1430 672 H1460" class="line-employer arrow" marker-end="url(#arrowEmployer)"/>
  <path d="M1595 737 C1595 764 1295 764 1295 789" class="line-employer arrow" marker-end="url(#arrowEmployer)"/>
  <path d="M1430 854 H1460" class="line-employer arrow" marker-end="url(#arrowEmployer)"/>
  <path d="M1595 919 C1595 950 1445 950 1445 971" class="line-employer arrow" marker-end="url(#arrowEmployer)"/>

  <!-- Shared layer links -->
  <path d="M640 490 C660 490 665 362 710 362" class="line-support arrow" marker-end="url(#arrowSupport)"/>
  <path d="M640 672 C665 672 665 454 710 454" class="line-support arrow" marker-end="url(#arrowSupport)"/>
  <path d="M1160 672 C1135 672 1135 454 1090 454" class="line-support arrow" marker-end="url(#arrowSupport)"/>
  <path d="M1460 490 C1230 490 1225 546 1090 546" class="line-support arrow" marker-end="url(#arrowSupport)"/>
  <path d="M370 854 C590 854 610 546 710 546" class="line-support arrow" marker-end="url(#arrowSupport)"/>
  <path d="M1160 854 C1130 854 1130 638 1090 638" class="line-support arrow" marker-end="url(#arrowSupport)"/>

  <!-- Bottom summary -->
  <rect x="70" y="1150" width="1660" height="118" rx="8" fill="#ffffff" stroke="#d6dde6" stroke-width="2" class="shadow"/>
  <text x="100" y="1186" class="section-title">Feature Coverage Summary for Interim Submission 2</text>
  <text x="100" y="1218" class="body">Candidate features: profile, education, experience, certifications, skill management, resume upload and parsing, job browsing, recommendations, applications, interviews, feedback, notifications, CV PDF builder.</text>
  <text x="100" y="1248" class="body">Employer features: profile, job creation, Gemini JD generation, job publishing, applicant review, AI ranking, status management, interview scheduling, feedback review, notifications.</text>
  <text x="100" y="1278" class="body">System features: JWT security, SQL Server database, EF Core migrations, Swagger API docs, AI service integration, Gemini integration, Supabase/local file storage, admin reports, audit logs, knowledge base.</text>
</svg>
